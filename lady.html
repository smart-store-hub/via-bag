  const cname=p.colors.length?p.colors[ci].name:'';
  const img=p.colors.length?imgPath(p.colors[ci].img):imgPath(p.main);
  vbAdd({code:p.code,name:p.name,variant:cname?('اللون: '+cname):'',price:p.priceAfter,img:img});
}
render();
</script>
