const G=[{"model": "3D", "variants": [{"code": "T1-MG-19", "model": "3D", "size": "16\"", "before": 705, "after": 705, "mains": ["2.jpg"], "designs": [{"img": "2.jpg", "name": "Pawpatrol"}, {"img": "3.jpg", "name": "Kurmi"}, {"img": "4.jpg", "name": "Frozen"}, {"img": "5.jpg", "name": "Princess"}, {"img": "6.jpg", "name": "Batman"}, {"img": "7.jpg", "name": "Kitty"}, {"img": "8.jpg", "name": "Spiderman"}]}], "desc": "شنطة مدرسية بتصميم ثلاثي الأبعاد مميز، مقاس 16 بوصة، خامة قوية بتصاميم متنوعة تناسب كل الأذواق."}, {"model": "Unique", "variants": [{"code": "T1-EG-3", "model": "Unique", "size": "16\"", "before": 785, "after": 785, "mains": ["10.jpg"], "designs": [{"img": "10.jpg", "name": "Purple"}, {"img": "11.jpg", "name": "Pink"}, {"img": "12.jpg", "name": "Blue"}, {"img": "13.jpg", "name": "Blue2"}]}], "desc": "شنطة مدرسية بتصميم أنيق وبسيط، مقاس 16 بوصة، خامة مريحة وألوان هادئة."}, {"model": "Game", "variants": [{"code": "T1-AG-51", "model": "Game", "size": "16\"", "before": 1025, "after": 1025, "mains": ["15.jpg"], "designs": [{"img": "15.jpg", "name": "Cat"}, {"img": "16.jpg", "name": "Princess"}, {"img": "17.jpg", "name": "Roblox"}, {"img": "18.jpg", "name": "Space"}, {"img": "19.jpg", "name": "Butterfly"}, {"img": "20.jpg", "name": "Dinosaur"}]}], "desc": "طقم مدرسي 3 قطع (شنطة + لانش باج + مقلمة) بتصميم لامع وشكل مجسم مميز، مقاس 16 بوصة."}, {"model": "Champion", "variants": [{"code": "T1-AG-14", "model": "Champion", "size": "16\"", "before": 1025, "after": 1025, "mains": ["22.jpg"], "designs": [{"img": "22.jpg", "name": "PawPatrol"}, {"img": "23.jpg", "name": "Roblox"}, {"img": "24.jpg", "name": "Spiderman"}, {"img": "25.jpg", "name": "Minecraft"}, {"img": "26.jpg", "name": "Roblox2"}]}], "desc": "طقم مدرسي 3 قطع مجهز لتركيب الترولي، مقاس 16 بوصة، خامة قوية وتصاميم حماسية."}, {"model": "Sparkle", "variants": [{"code": "T1-AG-16", "model": "Sparkle", "size": "16\"", "before": 1025, "after": 1025, "mains": ["28.jpg"], "designs": [{"img": "28.jpg", "name": "Unicorn"}, {"img": "29.jpg", "name": "Barbi"}, {"img": "30.jpg", "name": "Space"}, {"img": "31.jpg", "name": "Spiderman"}, {"img": "32.jpg", "name": "Batman"}]}], "desc": "طقم مدرسي 3 قطع بتفاصيل لامعة وفيونكة أنيقة، مقاس 16 بوصة، ألوان هادئة."}, {"model": "Twilight", "variants": [{"code": "T1-AG-17", "model": "Twilight", "size": "15\"", "before": 1025, "after": 1025, "mains": ["34.jpg"], "designs": [{"img": "34.jpg", "name": "Kurmi"}, {"img": "35.jpg", "name": "Roblox"}, {"img": "36.jpg", "name": "Barbi"}, {"img": "37.jpg", "name": "Spiderman"}, {"img": "38.jpg", "name": "Unicorn"}]}], "desc": "طقم مدرسي 3 قطع بألوان ليلية ساحرة، مقاس 15 بوصة، خامة قوية وتصميم مميز."}, {"model": "Trend", "variants": [{"code": "T1-AG-2", "model": "Trend", "size": "16\"", "before": 785, "after": 785, "mains": ["40.jpg"], "designs": [{"img": "40.jpg", "name": "Minecraft"}, {"img": "41.jpg", "name": "Spiderman"}, {"img": "42.jpg", "name": "Cute Girl"}, {"img": "43.jpg", "name": "Space"}, {"img": "44.jpg", "name": "Unicorn"}]}], "desc": "شنطة مدرسية منفردة بتصميم عصري، مقاس 16 بوصة، خامة قوية ومتوفرة بتصاميم متنوعة."}, {"model": "Comfort", "variants": [{"code": "T1-AG-4", "model": "Comfort", "size": "16\"", "before": 785, "after": 785, "mains": ["46.jpg"], "designs": [{"img": "46.jpg", "name": "Kurmi"}, {"img": "47.jpg", "name": "Unicorn"}, {"img": "48.jpg", "name": "Spiderman"}, {"img": "49.jpg", "name": "Batman"}]}], "desc": "شنطة مدرسية منفردة مريحة وخفيفة، مقاس 16 بوصة، بتصاميم متنوعة تناسب الأذواق المختلفة."}, {"model": "Active", "variants": [{"code": "T1-AG-3", "model": "Active", "size": "16\"", "before": 785, "after": 785, "mains": ["51.jpg"], "designs": [{"img": "51.jpg", "name": "Spiderman"}, {"img": "52.jpg", "name": "Kurmi"}, {"img": "53.jpg", "name": "Batman"}, {"img": "54.jpg", "name": "Melody"}]}], "desc": "شنطة مدرسية منفردة بتصميم حيوي ونشيط، مقاس 16 بوصة، خامة قوية تتحمل الاستخدام اليومي."}];
const st={};
function ip(f){return 'images/school_trendone/'+f;}
function getPrice(i){return G[i].variants[0].before;}
function render(indices){
 const g=document.getElementById('grid');
 g.innerHTML='';
 if(indices.length===0){g.innerHTML='<div class="no-results">مفيش منتجات في نطاق السعر ده</div>';return;}
 indices.forEach(i=>{
  const m=G[i];
  st[i]={s:0,d:0};
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<div class="imgbox" onclick="openLb(${i})"><span class="code-badge" id="cd-${i}"></span><img id="im-${i}" src="" alt="شنطة مدرسية ${m.model} من Via Bag" loading="lazy"></div>
   <div class="info"><div class="mname">${m.model}</div><div class="mdesc">${m.desc||''}</div>
    <div class="lbl" id="szl-${i}">المقاس</div><div class="sizes" id="sz-${i}"></div>
    <div class="lbl" id="dgl-${i}">التصميم</div><div class="designs" id="dg-${i}"></div>
    <div class="prow"><div class="pnow" id="pn-${i}"></div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="openMo(${i})" style="flex:1">اطلب الآن</button><button class="btnc" onclick="addCart(${i})" title="أضف للسلة">🛒</button></div>
   </div>`;
  g.appendChild(c); paint(i);
 });
}
function applyFilters(){
  const min=parseFloat(document.getElementById('fMin').value);
  const max=parseFloat(document.getElementById('fMax').value);
  const sort=document.getElementById('fSort').value;
  let indices=G.map((_,i)=>i).filter(i=>{
    const price=getPrice(i);
    if(!isNaN(min) && price<min) return false;
    if(!isNaN(max) && price>max) return false;
    return true;
  });
  if(sort==='asc') indices.sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='desc') indices.sort((a,b)=>getPrice(b)-getPrice(a));
  document.getElementById('resultCount').textContent=`عرض ${indices.length} من ${G.length} منتج`;
  render(indices);
}
function resetFilters(){document.getElementById('fMin').value='';document.getElementById('fMax').value='';document.getElementById('fSort').value='none';applyFilters();}
function paint(i){
 const m=G[i],v=m.variants[st[i].s];
 const showSizes = m.variants.length>1 || (v.size && v.size.trim());
 document.getElementById('szl-'+i).style.display = showSizes?'block':'none';
 document.getElementById('sz-'+i).style.display = showSizes?'flex':'none';
 if(showSizes) document.getElementById('sz-'+i).innerHTML=m.variants.map((x,j)=>`<div class="sz ${j===st[i].s?'on':''}" onclick="pS(${i},${j})">${x.size||('نوع '+(j+1))}</div>`).join('');
 const showDesigns = v.designs && v.designs.length>0;
 document.getElementById('dgl-'+i).style.display = showDesigns?'block':'none';
 document.getElementById('dg-'+i).style.display = showDesigns?'flex':'none';
 if(showDesigns) document.getElementById('dg-'+i).innerHTML=v.designs.map((d,j)=>`<div class="dsg ${j===st[i].d?'on':''}" onclick="pD(${i},${j})">${d.name}</div>`).join('');
 document.getElementById('pn-'+i).innerHTML=v.before+' <span>ج</span>';
 document.getElementById('cd-'+i).textContent=v.code;
 const img = showDesigns ? v.designs[st[i].d].img : v.mains[0];
 document.getElementById('im-'+i).src=ip(img);
}
function pS(i,j){st[i].s=j;st[i].d=0;paint(i)}
function pD(i,j){st[i].d=j;paint(i)}
let lbI=null,lbX=0,lbG=[];
function openLb(i){lbI=i;const v=G[i].variants[st[i].s];lbG=[...new Set(v.mains.concat(v.designs.map(d=>d.img)))];lbX=0;document.getElementById('lbImg').src=ip(lbG[0]);document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open')}
function lbNav(d){lbX=(lbX+d+lbG.length)%lbG.length;document.getElementById('lbImg').src=ip(lbG[lbX]);}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});
let moI=null;
function openMo(i){moI=i;const m=G[i],v=m.variants[st[i].s],d=(v.designs&&v.designs.length)?v.designs[st[i].d]:null;document.getElementById('pref').textContent=`${m.model} (${v.code}) — ${v.size} — ${d?d.name:''} — ${v.before} ج`;document.getElementById('mo').classList.add('open');}
function closeMo(){document.getElementById('mo').classList.remove('open')}
document.getElementById('mo').addEventListener('click',e=>{if(e.target.id==='mo')closeMo()});
function addCart(i){const m=G[i],v=m.variants[st[i].s],d=(v.designs&&v.designs.length)?v.designs[st[i].d]:null;const parts=[];if(v.size)parts.push('المقاس: '+v.size);if(d&&d.name)parts.push('التصميم: '+d.name);const img=d?d.img:v.mains[0];vbAdd({code:v.code,name:m.model,variant:parts.join(' · '),price:v.before,img:ip(img)});}
function send(){const n=mN.value.trim(),p=mP.value.trim(),c=mC.value.trim(),t=mT.value.trim();if(!n||!p){alert('من فضلك أدخل اسمك ورقم الواتساب');return}const ref=document.getElementById('pref').textContent;let msg=`مرحباً Via Bag 👜\n\nأريد الطلب التالي:\n📦 ${ref}\n👤 الاسم: ${n}\n📱 الواتساب: ${p}\n📍 المحافظة: ${c||'لم تحدد'}\n📝 ملاحظات: ${t||'لا يوجد'}`;const pr=window.vbGetPrize&&window.vbGetPrize();if(pr)msg+=`\n🎁 كوبون: ${pr.label} (${pr.code})`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');closeMo();}
applyFilters();
</script>

<script src="wheel.js"></script>
