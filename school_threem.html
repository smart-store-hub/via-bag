function ip(f){return 'images/school_threem/'+f;}
function getPrice(i){return G[i].variants[0].before;}
function render(indices){
 const g=document.getElementById('grid');
 g.innerHTML='';
 if(indices.length===0){g.innerHTML='<div class="no-results">مفيش منتجات في نطاق السعر ده</div>';return;}
 indices.forEach(i=>{
  const m=G[i];
  st[i]={s:0,d:0};

  c.innerHTML=`<div class="imgbox" onclick="openLb(${i})"><span class="code-badge" id="cd-${i}"></span><img id="im-${i}" src="" alt="شنطة مدرسية ${m.model} من Via Bag" loading="lazy"></div>
   <div class="info"><div class="mname">${m.model}</div><div class="mdesc">${m.desc||''}</div>
    <div class="lbl">المقاس</div><div class="sizes" id="sz-${i}"></div>
    <div class="lbl">التصميم</div><div class="designs" id="dg-${i}"></div>
    <div class="prow"><div class="pnow" id="pn-${i}"></div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="openMo(${i})" style="flex:1">اطلب الآن</button><button class="btnc" onclick="addCart(${i})" title="أضف للسلة">🛒</button></div>
   </div>`;
  g.appendChild(c); paint(i);
 });
}
function applyFilters(){
  const min=parseFloat(document.getElementById('fMin').value);
  const max=parseFloat(document.getElementById('fMax').value);
  const sort=document.getElementById('fSort').value;
  let indices=G.map((_,i)=>i).filter(i=>{
    const price=getPrice(i);
    if(!isNaN(min) && price<min) return false;
    if(!isNaN(max) && price>max) return false;
    return true;
  });
  if(sort==='asc') indices.sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='desc') indices.sort((a,b)=>getPrice(b)-getPrice(a));
  document.getElementById('resultCount').textContent=`عرض ${indices.length} من ${G.length} منتج`;
  render(indices);
}
function resetFilters(){document.getElementById('fMin').value='';document.getElementById('fMax').value='';document.getElementById('fSort').value='none';applyFilters();}

 document.getElementById('dg-'+i).innerHTML=v.designs.map((d,j)=>`<div class="dsg ${j===st[i].d?'on':''}" onclick="pD(${i},${j})">${d.name}</div>`).join('');
 document.getElementById('pn-'+i).innerHTML=v.before+' <span>ج</span>';
 document.getElementById('cd-'+i).textContent=v.code;
 const d=v.designs[st[i].d];
 if(d) document.getElementById('im-'+i).src=ip(d.img);
}
