const state={};
function imgPath(f){return 'images/school_chimola/'+f;}
function getPrice(p){return p.priceAfter;}
function render(list){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  if(list.length===0){grid.innerHTML='<div class="no-results">مفيش منتجات في نطاق السعر ده</div>';return;}
  list.forEach(p=>{
    state[p.id]={color:0,gallery:p.mainImgs.concat(p.colors.map(c=>c.img)),gIndex:0};
    const card=document.createElement('div');card.className='product-card';

    const disc=p.discount>0?`<span class="discount-badge">خصم ${p.discount}%</span>`:'';
    const before=p.priceBefore>p.priceAfter?`<span class="price-before">${p.priceBefore} ج</span>`:'';
    const sw=p.colors.map((c,i)=>`<div class="swatch ${i===0?'active':''}" style="background:${c.hex}" title="${c.name}" onclick="selectColor(${p.id},${i},event)"></div>`).join('');
    card.innerHTML=`
      <div class="product-img-wrap" onclick="openLightbox(${p.id})">${disc}<span class="code-badge">${p.code}</span><img id="img-${p.id}" src="${imgPath(p.main)}" alt="طقم مدرسي Chimola ${p.name} من Via Bag" loading="lazy"></div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-dims">${p.dims}</div>
        <div class="product-desc">${p.desc||''}</div>
        <div class="color-swatches">${sw}</div>
        <div class="swatch-label" id="clabel-${p.id}">${p.colors.length?'اللون: '+p.colors[0].name:''}</div>
        <div class="price-row"><div class="price-after">${p.priceAfter} <span>ج</span></div>${before}</div>
        <div style="display:flex;gap:8px"><button class="btn-order" onclick="openModal(${p.id})" style="flex:1">اطلب الآن</button><button class="btn-cart" onclick="addCart(${p.id})" title="أضف للسلة">🛒</button></div>
      </div>`;
    grid.appendChild(card);
  });
}
function selectColor(pid,ci,e){e.stopPropagation();const p=PRODUCTS.find(x=>x.id===pid);state[pid].color=ci;document.getElementById('img-'+pid).src=imgPath(p.colors[ci].img);document.getElementById('clabel-'+pid).textContent='اللون: '+p.colors[ci].name;e.target.parentElement.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));e.target.classList.add('active');}
let lbProduct=null;
function openLightbox(pid){lbProduct=pid;state[pid].gIndex=0;document.getElementById('lbImg').src=imgPath(state[pid].gallery[0]);document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open')}
function lbNav(dir){const g=state[lbProduct].gallery;state[lbProduct].gIndex=(state[lbProduct].gIndex+dir+g.length)%g.length;document.getElementById('lbImg').src=imgPath(g[state[lbProduct].gIndex]);}
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLightbox()});
let modalProduct=null;
function openModal(pid){modalProduct=pid;const p=PRODUCTS.find(x=>x.id===pid);const ci=state[pid].color;const cname=p.colors.length?p.colors[ci].name:'';document.getElementById('modalRef').textContent=`${p.name} (${p.code}) — ${p.priceAfter} ج${cname?' — '+cname:''}`;document.getElementById('orderModal').classList.add('open');}
function closeModal(){document.getElementById('orderModal').classList.remove('open')}
document.getElementById('orderModal').addEventListener('click',e=>{if(e.target.id==='orderModal')closeModal()});
function sendOrder(){const name=document.getElementById('mName').value.trim();const phone=document.getElementById('mPhone').value.trim();const city=document.getElementById('mCity').value.trim();const note=document.getElementById('mNote').value.trim();if(!name||!phone){alert('من فضلك أدخل اسمك ورقم الواتساب');return}const ref=document.getElementById('modalRef').textContent;const msg=`مرحباً ${WA_BRAND}\n\nأريد الطلب التالي:\n📦 ${ref}\n👤 الاسم: ${name}\n📱 الواتساب: ${phone}\n📍 المحافظة: ${city||'لم تحدد'}\n📝 ملاحظات: ${note||'لا يوجد'}`;window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');closeModal();}
function addCart(pid){
  const p=PRODUCTS.find(x=>x.id===pid);
  const ci=state[pid].color;
  const cname=p.colors.length?p.colors[ci].name:'';
  const img=p.colors.length?imgPath(p.colors[ci].img):imgPath(p.main);
  vbAdd({code:p.code,name:p.name,variant:cname?('اللون: '+cname):'',price:p.priceAfter,img:img});
}
function applyFilters(){
  const min=parseFloat(document.getElementById('fMin').value);
  const max=parseFloat(document.getElementById('fMax').value);
  const sort=document.getElementById('fSort').value;
  let list=PRODUCTS.filter(p=>{
    const price=getPrice(p);
    if(!isNaN(min) && price<min) return false;
    if(!isNaN(max) && price>max) return false;
    return true;
  });
  if(sort==='asc') list=list.slice().sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='desc') list=list.slice().sort((a,b)=>getPrice(b)-getPrice(a));
  document.getElementById('resultCount').textContent=`عرض ${list.length} من ${PRODUCTS.length} منتج`;
  render(list);
}
function resetFilters(){document.getElementById('fMin').value='';document.getElementById('fMax').value='';document.getElementById('fSort').value='none';applyFilters();}
applyFilters();
