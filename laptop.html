function getPrice(i){return G[i].variants[0].before;}
function render(indices){
 const g=document.getElementById('grid');
 g.innerHTML='';
 if(indices.length===0){g.innerHTML='<div class="no-results">مفيش منتجات في نطاق السعر ده</div>';return;}
 indices.forEach(i=>{
  const m=G[i];
  st[i]={s:0,d:0};
  const c=document.createElement('div');c.className='card';
  const bc=BRAND_COLORS[m.brand]||'var(--lap)';
  c.innerHTML=`<div class="imgbox" onclick="openLb(${i})"><span class="code-badge" id="cd-${i}"></span><img id="im-${i}" src="" alt="شنطة لاب توب ${m.model} من Via Bag" loading="lazy"></div>
   <div class="info"><div class="mname">${m.model}</div><div class="brand-tag" style="background:${bc}">${m.brand}</div><div class="mdesc">${m.desc||''}</div>
    <div class="lbl" id="szl-${i}">المقاس</div><div class="sizes" id="sz-${i}"></div>
    <div class="lbl" id="dgl-${i}">اللون / التصميم</div><div class="designs" id="dg-${i}"></div>
    <div class="prow"><div class="pnow" id="pn-${i}"></div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="openMo(${i})" style="flex:1">اطلبي الآن</button><button class="btnc" onclick="addCart(${i})" title="أضيفي للسلة">🛒</button></div>
   </div>`;
  g.appendChild(c); paint(i);
 });
}
function applyFilters(){
  const min=parseFloat(document.getElementById('fMin').value);
  const max=parseFloat(document.getElementById('fMax').value);
  const sort=document.getElementById('fSort').value;
  const brand=document.getElementById('fBrand').value;
  let indices=G.map((_,i)=>i).filter(i=>{
    if(brand!=='all' && G[i].brand!==brand) return false;
    const price=getPrice(i);
    if(!isNaN(min) && price<min) return false;
    if(!isNaN(max) && price>max) return false;
    return true;
  });
  if(sort==='asc') indices.sort((a,b)=>getPrice(a)-getPrice(b));
  else if(sort==='desc') indices.sort((a,b)=>getPrice(b)-getPrice(a));
  document.getElementById('resultCount').textContent=`عرض ${indices.length} من ${G.length} منتج`;
  render(indices);
}
function resetFilters(){document.getElementById('fMin').value='';document.getElementById('fMax').value='';document.getElementById('fSort').value='none';document.getElementById('fBrand').value='all';applyFilters();}
function paint(i){
 const m=G[i],v=m.variants[st[i].s];
 const showSizes = m.variants.length>1 || (v.size && v.size.trim());
 document.getElementById('szl-'+i).style.display = showSizes?'block':'none';
 document.getElementById('sz-'+i).style.display = showSizes?'flex':'none';
 if(showSizes) document.getElementById('sz-'+i).innerHTML=m.variants.map((x,j)=>`<div class="sz ${j===st[i].s?'on':''}" onclick="pS(${i},${j})">${x.size||('نوع '+(j+1))}</div>`).join('');
 const showDesigns = v.designs && v.designs.length>0;
 document.getElementById('dgl-'+i).style.display = showDesigns?'block':'none';
 document.getElementById('dg-'+i).style.display = showDesigns?'flex':'none';
 if(showDesigns) document.getElementById('dg-'+i).innerHTML=v.designs.map((d,j)=>`<div class="dsg ${j===st[i].d?'on':''}" onclick="pD(${i},${j})">${d.name}</div>`).join('');
 document.getElementById('pn-'+i).innerHTML=v.before+' <span>ج</span>';
 document.getElementById('cd-'+i).textContent=v.code;
 const img = showDesigns ? v.designs[st[i].d].img : v.mains[0];
 document.getElementById('im-'+i).src=ip(m.folder,img);
}
function pS(i,j){st[i].s=j;st[i].d=0;paint(i)}
function pD(i,j){st[i].d=j;paint(i)}
let lbI=null,lbX=0,lbG=[],lbF='';
function openLb(i){lbI=i;const m=G[i],v=m.variants[st[i].s];lbF=m.folder;lbG=[...new Set(v.mains.concat((v.designs||[]).map(d=>d.img)))];lbX=0;document.getElementById('lbImg').src=ip(lbF,lbG[0]);document.getElementById('lb').classList.add('open');}
function closeLb(){document.getElementById('lb').classList.remove('open')}
function lbNav(d){lbX=(lbX+d+lbG.length)%lbG.length;document.getElementById('lbImg').src=ip(lbF,lbG[lbX]);}
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb()});
let moI=null;
function openMo(i){moI=i;const m=G[i],v=m.variants[st[i].s],d=(v.designs&&v.designs.length)?v.designs[st[i].d]:null;document.getElementById('pref').textContent=`${m.model} (${v.code}) — ${m.brand}${v.size?' — '+v.size:''}${d?' — '+d.name:''} — ${v.before} ج`;document.getElementById('mo').classList.add('open');}
function closeMo(){document.getElementById('mo').classList.remove('open')}
document.getElementById('mo').addEventListener('click',e=>{if(e.target.id==='mo')closeMo()});
function addCart(i){const m=G[i],v=m.variants[st[i].s],d=(v.designs&&v.designs.length)?v.designs[st[i].d]:null;const parts=[];parts.push('الماركة: '+m.brand);if(v.size)parts.push('المقاس: '+v.size);if(d&&d.name)parts.push('اللون: '+d.name);const img=d?d.img:v.mains[0];vbAdd({code:v.code,name:m.model,variant:parts.join(' · '),price:v.before,img:ip(m.folder,img)});}
function send(){const n=mN.value.trim(),p=mP.value.trim(),c=mC.value.trim(),t=mT.value.trim();if(!n||!p){alert('من فضلك أدخلي اسمك ورقم الواتساب');return}const ref=document.getElementById('pref').textContent;let msg=`مرحباً Via Bag 👜\n\nأريد الطلب التالي:\n📦 ${ref}\n👤 الاسم: ${n}\n📱 الواتساب: ${p}\n📍 المحافظة: ${c||'لم تحدد'}\n📝 ملاحظات: ${t||'لا يوجد'}`;const pr=window.vbGetPrize&&window.vbGetPrize();if(pr)msg+=`\n🎁 كوبون: ${pr.label} (${pr.code})`;window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`,'_blank');closeMo();}
applyFilters();
